<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ strings.app_name }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <a href="/?lang={{ lang }}" class="brand">
                <span class="brand-mark">🎬</span>
                <span class="brand-name">{{ strings.app_name }}</span>
            </a>
            <nav class="topnav">
                <a href="/?lang={{ lang }}">{{ strings.dashboard }}</a>
                <a href="/settings?lang={{ lang }}">{{ strings.settings }}</a>
                <div class="lang-switch">
                    <a href="?lang=en" class="{{ 'active' if lang=='en' else '' }}">EN</a>
                    <span>/</span>
                    <a href="?lang=ar" class="{{ 'active' if lang=='ar' else '' }}">AR</a>
                </div>
            </nav>
        </header>

        {% if demo_mode %}
        <div class="demo-banner">⚡ {{ strings.demo_mode_banner }}</div>
        {% endif %}

        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="/static/js/app.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
